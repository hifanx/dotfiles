onboarding = false

[theme]
auto_switch = false

[theme.custom] # isekai, every palette token set so no built-in theme shows through
sidebar_bg = "transparent"
panel_bg = "transparent"
active_row_bg = "#171920" # cursorline
selection_bg = "#2B2E3B" # visual
accent = "#A6E3A1" # green_bright
surface0 = "#242438" # border
surface1 = "#2B2E3B" # visual
surface_dim = "#242438" # border
overlay0 = "#4F5162" # comment
overlay1 = "#8F96B0" # subtext
text = "#A3A7B5" # text
subtext0 = "#8F96B0" # subtext
mauve = "#9B86C5" # purple
green = "#A6E3A1" # green_bright
yellow = "#F9E2AF" # yellow_bright
red = "#ED6677" # red_bright
blue = "#83BCFF" # blue_bright
teal = "#669FA4" # cyan
peach = "#FFAC81" # orange_bright

[keys]
prefix = "ctrl+a"
workspace_picker = "prefix+n"
goto = "prefix+w"
split_vertical = "prefix+|"
split_horizontal = "prefix+backslash"
toggle_sidebar = "prefix+a"

[ui]
sidebar_collapsed_mode = "hidden"
confirm_close = false
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = false

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "yadm enter lazygit"
description = "yadm lazygit"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch terminal"
width = "90%"
height = "85%"
