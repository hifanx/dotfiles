[display]
compact = false
use_pager = true
show_title = true

[style.description]
foreground = { rgb = { r = 79, g = 81, b = 98 } } # comment = "#4F5162"

[style.command_name]
foreground = { rgb = { r = 155, g = 134, b = 197 } } # purple = "#9B86C5"
bold = true

[style.example_text]
foreground = { rgb = { r = 163, g = 167, b = 181 } } # text = "#A3A7B5"
bold = true
italic = true

[style.example_code]
foreground = { rgb = { r = 182, g = 131, b = 144 } } # red = "#B68390"

[style.example_variable]
foreground = { rgb = { r = 143, g = 150, b = 176 } } # subtext = "#8F96B0"

[updates]
auto_update = true
auto_update_interval_hours = 24

[directories]
custom_pages_dir = "/Users/sif/.config/tealdeer/pages/"
