[display]
compact = false
use_pager = true
show_title = true

[style.description]
foreground = { rgb = { r = 99, g = 102, b = 124 } } # comment = "#63667C"

[style.command_name]
foreground = { rgb = { r = 145, g = 125, b = 184 } } # purple = "#917DB8"
bold = true

[style.example_text]
foreground = { rgb = { r = 163, g = 167, b = 181 } } # text = "#A3A7B5"
bold = true
italic = true

[style.example_code]
foreground = { rgb = { r = 169, g = 122, b = 134 } } # red = '#A97A86'

[style.example_variable]
foreground = { rgb = { r = 143, g = 150, b = 176 } } # subtext = '#8F96B0',

[updates]
auto_update = true
auto_update_interval_hours = 24

[directories]
custom_pages_dir = "/Users/sif/.config/tealdeer/pages/"
