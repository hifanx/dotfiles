gui:
  theme:
    activeBorderColor:
      - "#FFAC81" # orange_bright
      - bold
    inactiveBorderColor:
      - "#8F96B0" # subtext
    optionsTextColor:
      - "#83BCFF" # blue_bright
    selectedLineBgColor:
      - "#2B2E3B" # visual
    cherryPickedCommitBgColor:
      - "#242438" # border
    cherryPickedCommitFgColor:
      - "#FFAC81" # orange_bright
    unstagedChangesColor:
      - "#ED6677" # red_bright
    defaultFgColor:
      - "#A3A7B5" # text
    searchingActiveBorderColor:
      - "#F9E2AF" # yellow_bright
    authorColors:
      "*": "#CDC1FF" # purple_bright
  showIcons: true
  nerdFontsVersion: "3"
git:
  diffRenderers:
    - command: difft --color=always --syntax-highlight=on --tab-width=2
      type: extDiff
customCommands:
  - key: "<c-g>"
    description: "Generate AI commit message (pi)"
    context: "files"
    prompts:
      - type: "input"
        title: "Intent (optional, Enter to skip)"
        key: "Intent"
    command: >
      bash "$HOME/.config/lazygit/commit-msg-pi.sh" {{.Form.Intent | quote}}
    output: terminal
