gui:
  theme:
    activeBorderColor:
      - "#FAB387"
      - bold
    inactiveBorderColor:
      - "#A6ADC8"
    optionsTextColor:
      - "#89B4FA"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475A"
    cherryPickedCommitFgColor:
      - "#FAB387"
    unstagedChangesColor:
      - "#F38BA8"
    defaultFgColor:
      - "#CDD6F4"
    searchingActiveBorderColor:
      - "#F9E2AF"
  authorColors:
    "*": "#B4BEFE"
  showIcons: true
  nerdFontsVersion: "3"
git:
  diffRenderers:
    - command: difft --color=always --syntax-highlight=on --tab-width=2
      type: extDiff
customCommands:
  - key: "<c-g>"
    description: "Generate AI commit message (OpenCode)"
    context: "files"
    command: >
      bash -c 'git diff --cached | opencode run --model opencode-go/glm-5.3-flash "Write a Conventional Commits-style commit message for this diff. Use the format type(scope): description, where type is one of feat, fix, docs, style, refactor, perf, test, build, ci, or chore. Scope is mandatory — omit it only if the change is not scoped to one clear area. Keep the description in imperative mood, lowercase, no trailing period, under 72 characters. Add a body only if the change needs more explanation, separated by a blank line. Output only the commit message, nothing else — no backticks, no explanation." > /tmp/commit_msg.txt && git commit -e -F /tmp/commit_msg.txt'

    output: terminal
