gui:
  theme:
    activeBorderColor:
      - "#FAB387"
      - bold
    inactiveBorderColor:
      - "#A6ADC8"
    optionsTextColor:
      - "#89B4FA"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475A"
    cherryPickedCommitFgColor:
      - "#FAB387"
    unstagedChangesColor:
      - "#F38BA8"
    defaultFgColor:
      - "#CDD6F4"
    searchingActiveBorderColor:
      - "#F9E2AF"
  authorColors:
    "*": "#B4BEFE"
  showIcons: true
  nerdFontsVersion: "3"
git:
  diffRenderers:
    - command: difft --color=always --syntax-highlight=on --tab-width=2
      type: extDiff
customCommands:
  - key: "<c-g>"
    description: "Generate AI commit message (OpenCode)"
    context: "files"
    command: >
      bash -c '(git diff --cached | head -c 100000; echo; git log --oneline -10) | opencode run --pure --agent Commit --model opencode-go/deepseek-v4.1-flash "Write a commit message for this diff." > /tmp/commit_msg.txt && git commit -e -F /tmp/commit_msg.txt'

    output: terminal
